[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "brats/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["brats"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", "docs", "figures", ".github"]

[project]
dynamic = ["version"]
requires-python = ">=3.9,<4.0"
name = "brats"
description = "BraTS algorithms"
authors = [
  { name = "Marcel Rosier", email = "marcel.rosier@tum.de" },
  { name = "Florian Kofler", email = "florian.kofler@tum.de" },
]

readme = "README.md"
license = "Apache-2.0"
keywords = [
  "brain tumor",
  "glioma",
  "BraTS",
  "brain lesion",
  "segmentation",
  "synthesis",
  "inpainting",
]

dependencies = [
  "spython>=0.3.14",
  "docker>=7.0.0",
  "rich>=13.0.0",
  "PyYAML>=6.0.1",
  "dacite>=1.8.0",
  "loguru>=0.7.0",
  "nibabel>=5.0.0",
  "numpy>=1.21.0; python_version<='3.9'",
  "numpy>=1.26.0; python_version>='3.10'",
]

[project.optional-dependencies]
preprocessing = ["brainles_preprocessing>=0.6.7; python_version >= '3.10'"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.2",
  "pre-commit>=3.8.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-jupyter>=0.25",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
per-file-ignores = { "brats/__init__.py" = ["F401"] }
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade
    "PIE",    # flake8-pie
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "FURB",   # refurb
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "PERF",   # perflint
]
ignore = [
    "E501",    # line too long — ruff-format handles this
    "UP007",   # X | Y union syntax — needs Python 3.10+
    "UP045",   # X | None optional syntax — needs Python 3.10+
    "PERF203", # try/except in loop — acceptable in tests
]

[tool.ruff.lint.isort]
known-first-party = ["brats"]
